
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <link rel="stylesheet" href="../css/estilos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição</title>
</head>
<body>
    <h2>Inscrição no Clube de Cibersegurança</h2>

<li><a href="../index.html">Início</a></li>
<li><a href="atividades.html">Atividades</a></li>
<li><a href="../paginas/galeria.html">Exemplos de Barulhos e Vídeos</a></li>

<form action="inscricao.html" method="get">
    <p>
        <article class="cartão">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
        </article>
    </p>

    <p>
        <article class="cartão">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        </article>
    </p>

    <p>
        <article class="cartão">
        <label for="oficina">Oficina</label>
        <select id="oficina" name="oficina" required>
            <option value="">Escolhe uma oficina</option>
            <option value="web">Páginas web</option>
            <option value="seguranca">Sites maliciosos</option>
            <option value="privacidade">Jogos</option>
        </select>
        
    </p>

    <p>
        <label for="mensagem">Mensagem (opcional)</label>

        <br><br>

        <textarea id="mensagem" name="mensagem" rows="3"></textarea>
        </article>
    </p>

    <button type="submit"><strong>Inscrição</strong></button>
</form>

</body>
</html>
